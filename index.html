<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Costos Industriales</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#18212f;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{background:#172b4d;color:#fff;padding:24px max(20px,calc((100% - 1100px)/2))}header h1{margin:0;font-size:25px}header p{margin:7px 0 0;color:#d6e0ee}.wrap{max-width:1100px;margin:24px auto;padding:0 18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button,.btn{border:0;border-radius:9px;padding:10px 14px;background:#e0e7ef;color:#1d3557;font-weight:650;cursor:pointer}.tabs button.active,.btn.primary{background:#2458a6;color:white}.panel{background:white;border:1px solid #e0e5eb;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #1a2b4408}.panel h2{font-size:19px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.field label{display:block;font-size:13px;font-weight:650;color:#536174;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #cbd4df;border-radius:8px;padding:10px;font:inherit;background:white}.actions{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:14px}.muted{color:#687588;font-size:13px}.tablewrap{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #e9edf2;white-space:nowrap}th{font-size:12px;color:#687588;text-transform:uppercase}.num{text-align:right}.del{background:#fff0f0;color:#a22;border:0;border-radius:7px;padding:7px 9px;cursor:pointer}.result{background:#edf5ff;border-radius:12px;padding:16px;margin-top:16px}.result strong{font-size:25px;color:#174b8c}.pill{display:inline-block;border-radius:20px;background:#edf1f6;padding:4px 9px;font-size:12px}.empty{padding:18px;text-align:center;color:#788596}.notice{font-size:13px;background:#fff7e6;border:1px solid #f1dfb6;padding:12px;border-radius:10px;margin-top:14px}footer{max-width:1100px;margin:20px auto;padding:0 18px 28px;color:#778295;font-size:12px}@media(max-width:600px){header{padding:20px}.panel{padding:15px}.tabs button{flex:1}}
</style></head>
<body><header><h1>Costos Industriales</h1><p>Calculá el costo de productos y sus presentaciones</p></header>
<main class="wrap"><nav class="tabs" id="tabs"><button class="active" data-tab="calc">Calculadora</button><button data-tab="products">Productos a granel</button><button data-tab="materials">Packaging</button><button data-tab="history">Historial</button></nav>
<section id="app"></section></main><footer>Prototipo inicial · Los datos se guardan en este navegador. Todavía no se sincronizan entre computadoras.</footer>
<script>
const KEY='costos-industriales-v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY))||{products:[],materials:[],history:[]}}catch{db={products:[],materials:[],history:[]}}
let tab='calc';
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function field(label,id,type='text',value='',extra=''){return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></div>'}
function options(items,unit=false){return items.map((x,i)=>'<option value="'+i+'">'+esc(x.name)+(unit?' · '+esc(x.unit):'')+'</option>').join('')}
function render(){
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const root=document.getElementById('app');
 if(tab==='products'){root.innerHTML='<div class="panel"><h2>Nuevo producto a granel</h2><form id="productForm"><div class="grid">'+field('Nombre del producto','pname')+'<div class="field"><label for="punit">Unidad base</label><select id="punit"><option value="L">Litro (L)</option><option value="kg">Kilogramo (kg)</option></select></div>'+field('Costo por litro o kg ($)','pcost','number','','min="0" step="0.01" required')+'</div><div class="actions"><button class="btn primary">Guardar producto</button></div></form></div><div class="panel"><h2>Productos cargados ('+db.products.length+')</h2>'+table(db.products,['Producto','Unidad','Costo unitario'],p=>[p.name,p.unit,money(p.cost)],'products')+'</div>'}
 else if(tab==='materials'){root.innerHTML='<div class="panel"><h2>Nuevo material de packaging</h2><form id="materialForm"><div class="grid">'+field('Nombre del material','mname')+'<div class="field"><label for="mtype">Tipo</label><select id="mtype"><option>Envase</option><option>Tapa</option><option>Etiqueta</option><option>Caja</option><option>Precinto</option><option>Otro</option></select></div>'+field('Costo por unidad ($)','mcost','number','','min="0" step="0.01" required')+'</div><div class="actions"><button class="btn primary">Guardar material</button></div></form></div><div class="panel"><h2>Materiales cargados ('+db.materials.length+')</h2>'+table(db.materials,['Material','Tipo','Costo unitario'],m=>[m.name,m.type,money(m.cost)],'materials')+'</div>'}
 else if(tab==='history'){root.innerHTML='<div class="panel"><h2>Historial de cálculos</h2><p class="muted">Cada cálculo guarda una copia de los costos utilizados.</p>'+ (db.history.length?'<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Presentación</th><th class="num">Granel</th><th class="num">Packaging</th><th class="num">Total</th></tr></thead><tbody>'+db.history.slice().reverse().map(h=>'<tr><td>'+esc(h.date)+'</td><td>'+esc(h.product)+'</td><td>'+esc(h.amount+' '+h.unit)+'</td><td class="num">'+money(h.bulk)+'</td><td class="num">'+money(h.pack)+'</td><td class="num"><b>'+money(h.total)+'</b></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Todavía no hay cálculos guardados.</div>')+'<div class="actions"><button class="btn" id="export">Exportar datos (JSON)</button><button class="btn" id="backup">Descargar historial (CSV)</button></div></div>'}
 else {root.innerHTML='<div class="panel"><h2>Calcular costo de presentación</h2><form id="calcForm"><div class="grid"><div class="field"><label for="cproduct">Producto a granel</label><select id="cproduct" required><option value="">Seleccioná un producto</option>'+options(db.products,true)+'</select></div>'+field('Contenido por envase','amount','number','1','min="0.001" step="any" required')+'<div class="field"><label for="cunit">Unidad</label><input id="cunit" value="Elegí un producto" disabled></div></div><div class="field" style="margin-top:18px"><label>Materiales de packaging</label><div id="materialRows"></div></div><div class="actions"><button type="button" class="btn" id="addMaterial">+ Agregar material</button><button class="btn primary">Calcular y guardar</button></div></form><div id="result"></div><div class="notice">Importante: los productos en litros y en kilos se mantienen separados. Los importes de este prototipo están expresados en pesos argentinos.</div></div><div class="panel"><h2>Resumen</h2><div class="grid"><div><span class="muted">Productos</span><h2>'+db.products.length+'</h2></div><div><span class="muted">Materiales</span><h2>'+db.materials.length+'</h2></div><div><span class="muted">Cálculos guardados</span><h2>'+db.history.length+'</h2></div></div></div>';
 const p=document.getElementById('cproduct'),u=document.getElementById('cunit');p.addEventListener('change',()=>{u.value=p.value===''?'Elegí un producto':db.products[p.value].unit});document.getElementById('addMaterial').addEventListener('click',addMaterialRow);addMaterialRow();}
}
function table(arr,heads,vals,key){if(!arr.length)return '<div class="empty">Todavía no hay registros.</div>';return '<div class="tablewrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'<th></th></tr></thead><tbody>'+arr.map((x,i)=>'<tr>'+vals(x).map(v=>'<td>'+esc(v)+'</td>').join('')+'<td><button class="del" data-delete="'+key+'" data-index="'+i+'">Eliminar</button></td></tr>').join('')+'</tbody></table></div>'}
function addMaterialRow(){const el=document.getElementById('materialRows');if(!db.materials.length){el.innerHTML='<p class="muted">Primero cargá materiales en la pestaña Packaging.</p>';return}const row=document.createElement('div');row.className='grid';row.style.marginTop='8px';row.innerHTML='<div class="field"><label>Material</label><select class="mat-select">'+options(db.materials,true)+'</select></div><div class="field"><label>Cantidad por envase</label><input class="mat-qty" type="number" min="0" step="any" value="1"></div><div class="actions"><button type="button" class="del remove-row">Quitar</button></div>';row.querySelector('.remove-row').onclick=()=>row.remove();el.appendChild(row)}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b){tab=b.dataset.tab;render()}});
document.getElementById('app').addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='productForm'){const name=document.getElementById('pname').value.trim(),unit=document.getElementById('punit').value,cost=Number(document.getElementById('pcost').value);if(!name||cost<0)return;db.products.push({name,unit,cost});save();render()}else if(e.target.id==='materialForm'){const name=document.getElementById('mname').value.trim(),type=document.getElementById('mtype').value,cost=Number(document.getElementById('mcost').value);if(!name||cost<0)return;db.materials.push({name,type,cost});save();render()}else if(e.target.id==='calcForm'){calculate()}});
document.getElementById('app').addEventListener('click',e=>{const d=e.target.closest('[data-delete]');if(d){if(confirm('¿Eliminar este registro?')){db[d.dataset.delete].splice(Number(d.dataset.index),1);save();render()}}if(e.target.id==='export'){download('costos-industriales.json',JSON.stringify(db,null,2),'application/json')}if(e.target.id==='backup'){const rows=[['fecha','producto','cantidad','unidad','costo_granel','costo_packaging','costo_total'],...db.history.map(h=>[h.date,h.product,h.amount,h.unit,h.bulk,h.pack,h.total])];download('historial-costos.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv;charset=utf-8')}});
function calculate(){const pi=document.getElementById('cproduct').value;if(pi===''){alert('Elegí un producto.');return}const p=db.products[pi],amount=Number(document.getElementById('amount').value);if(!(amount>0)){alert('Ingresá un contenido mayor a cero.');return}let pack=0,lines=[];document.querySelectorAll('#materialRows .grid').forEach(row=>{const mi=Number(row.querySelector('.mat-select').value),qty=Number(row.querySelector('.mat-qty').value);if(db.materials[mi]&&qty>0){const m=db.materials[mi],subtotal=m.cost*qty;pack+=subtotal;lines.push({name:m.name,qty,cost:m.cost,subtotal})}});const bulk=amount*p.cost,total=bulk+pack;const h={date:new Date().toLocaleString('es-AR'),product:p.name,unit:p.unit,amount,bulkCost:p.cost,bulk,pack,total,lines};db.history.push(h);save();document.getElementById('result').innerHTML='<div class="result"><div class="muted">Costo total por envase</div><strong>'+money(total)+'</strong><div class="tablewrap"><table><tbody><tr><td>Producto a granel ('+amount+' '+p.unit+' × '+money(p.cost)+')</td><td class="num">'+money(bulk)+'</td></tr>'+lines.map(l=>'<tr><td>'+esc(l.name)+' ('+l.qty+' × '+money(l.cost)+')</td><td class="num">'+money(l.subtotal)+'</td></tr>').join('')+'<tr><td><b>Total</b></td><td class="num"><b>'+money(total)+'</b></td></tr></tbody></table></div><p class="muted">El cálculo quedó guardado en Historial.</p></div>'}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
render();
</script></body></html>
