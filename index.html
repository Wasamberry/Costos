<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Costos Industriales</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#18212f;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{background:#172b4d;color:#fff;padding:24px max(20px,calc((100% - 1100px)/2))}header h1{margin:0;font-size:25px}header p{margin:7px 0 0;color:#d6e0ee}.wrap{max-width:1100px;margin:24px auto;padding:0 18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button,.btn{border:0;border-radius:9px;padding:10px 14px;background:#e0e7ef;color:#1d3557;font-weight:650;cursor:pointer}.tabs button.active,.btn.primary{background:#2458a6;color:white}.panel{background:white;border:1px solid #e0e5eb;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #1a2b4408}.panel h2{font-size:19px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.field label{display:block;font-size:13px;font-weight:650;color:#536174;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #cbd4df;border-radius:8px;padding:10px;font:inherit;background:white}.actions{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:14px}.muted{color:#687588;font-size:13px}.tablewrap{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #e9edf2;white-space:nowrap}th{font-size:12px;color:#687588;text-transform:uppercase}.num{text-align:right}.del{background:#fff0f0;color:#a22;border:0;border-radius:7px;padding:7px 9px;cursor:pointer}.edit{background:#e8f1ff;color:#174b8c;border:0;border-radius:7px;padding:7px 9px;cursor:pointer}.result{background:#edf5ff;border-radius:12px;padding:16px;margin-top:16px}.result strong{font-size:25px;color:#174b8c}.empty{padding:18px;text-align:center;color:#788596}.notice{font-size:13px;background:#fff7e6;border:1px solid #f1dfb6;padding:12px;border-radius:10px;margin-top:14px}.stale{color:#b42318!important;background:#fff0f0!important;font-weight:700}.fresh{color:#287345}.price-date{font-size:12px}.actions-cell{display:flex;gap:6px}footer{max-width:1100px;margin:20px auto;padding:0 18px 28px;color:#778295;font-size:12px}@media(max-width:600px){header{padding:20px}.panel{padding:15px}.tabs button{flex:1}}
</style></head><body><header><h1>Costos Industriales</h1><p>Costos en dólares, fechas de actualización y cálculo por presentación</p></header>
<main class="wrap"><nav class="tabs" id="tabs"><button class="active" data-tab="home">Inicio</button><button data-tab="calc">Calculadora</button><button data-tab="products">Productos a granel</button><button data-tab="materials">Packaging</button><button data-tab="dollar">Costo del dólar</button><button data-tab="history">Historial</button></nav><section id="app"></section></main><footer>Prototipo inicial · Datos guardados en este navegador. Para sincronizar entre computadoras hace falta conectar una base de datos.</footer>
<script>
const KEY='costos-industriales-v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY))||{products:[],materials:[],history:[]}}catch{db={products:[],materials:[],history:[]}}
db.products ||= [];db.materials ||= [];db.history ||= [];db.settings ||= {dollarRate:0,dollarDate:''};
db.products.forEach(p=>{p.priceDate ||= '';p.cost=Number(p.cost)||0;p.family ||= 'Sin familia'});
db.materials.forEach(m=>{m.priceDate ||= '';m.cost=Number(m.cost)||0});
let tab='calc',editing=null;
const today=()=>new Date().toISOString().slice(0,10);
const usd=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:4}).format(Number(n)||0);
const ars=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function stale(date){if(!date)return true;const age=(new Date(today()+'T00:00:00')-new Date(date+'T00:00:00'))/86400000;return age>30}
function dateCell(date){const old=stale(date);return '<span class="'+(old?'stale':'fresh')+'">'+(date?esc(date):'Sin fecha')+'</span>'+(old?' <span class="stale">· VENCIDO</span>':'')}
function dollarValue(){return Number(db.settings.dollarRate)||0}
function usdArs(n,rate=dollarValue()){return rate>0?ars(n*rate):'—'}
function field(label,id,type='text',value='',extra=''){return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></div>'}
function options(items,unit=false){return items.map((x,i)=>'<option value="'+i+'">'+esc(x.name)+(unit?' · '+esc(x.unit):'')+'</option>').join('')}
function render(){
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const root=document.getElementById('app');
 if(tab==='home'){
  const grouped={};db.products.forEach(p=>{const fam=(p.family||'Sin familia').trim()||'Sin familia';(grouped[fam] ||= []).push(p)});
  const families=Object.keys(grouped).sort((a,b)=>a.localeCompare(b,'es'));
  root.innerHTML='<div class="panel"><h2>Costo del dólar</h2><div class="grid"><div><span class="muted">Cotización vigente (ARS por USD)</span><h2>'+(dollarValue()?ars(dollarValue()):'Sin cargar')+'</h2></div><div><span class="muted">Fecha de actualización</span><h2 class="'+(stale(db.settings.dollarDate)?'stale':'')+'">'+(db.settings.dollarDate?esc(db.settings.dollarDate):'Sin fecha')+'</h2></div><div><span class="muted">Estado</span><h2 class="'+(stale(db.settings.dollarDate)?'stale':'fresh')+'">'+(stale(db.settings.dollarDate)?'Actualizar cotización':'Vigente')+'</h2></div></div><div class="actions"><button class="btn primary" id="goDollar">Cargar / actualizar dólar</button></div></div><div class="panel"><h2>Productos costeados</h2><p class="muted">Listado por familia con unidad base y costo unitario. Los costos con más de 30 días aparecen en rojo.</p>'+(db.products.length?families.map(fam=>'<h3 style="margin:20px 0 8px">'+esc(fam)+'</h3><div class="tablewrap"><table><thead><tr><th>Familia</th><th>Nombre</th><th>Litros / unidad base</th><th class="num">Costo unitario (USD)</th><th class="num">Costo unitario (ARS)</th><th>Fecha costo</th></tr></thead><tbody>'+grouped[fam].slice().sort((a,b)=>a.name.localeCompare(b.name,'es')).map(p=>'<tr><td>'+esc(fam)+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.unit)+'</td><td class="num '+(stale(p.priceDate)?'stale':'')+'">'+usd(p.cost)+' / '+esc(p.unit)+'</td><td class="num '+(stale(p.priceDate)?'stale':'')+'">'+(dollarValue()?ars(p.cost*dollarValue())+' / '+esc(p.unit):'—')+'</td><td>'+dateCell(p.priceDate)+'</td></tr>').join('')+'</tbody></table></div>').join(''):'<div class="empty">Todavía no hay productos cargados. Agregalos en “Productos a granel”.</div>')+'</div>';
 }else if(tab==='products'||tab==='materials'){
  const prod=tab==='products',key=prod?'products':'materials',label=prod?'producto':'material',items=db[key],x=editing&&editing.key===key?items[editing.index]:null;
  root.innerHTML='<div class="panel"><h2>'+(x?'Editar '+label:'Nuevo '+label)+(prod?' a granel':' de packaging')+'</h2><form id="itemForm"><div class="grid">'+field('Nombre','iname','text',x?.name||'','required')+(prod?field('Familia','ifamily','text',x?.family||'','placeholder="Ej. Limpieza, Automotor, Industrial"')+'<div class="field"><label for="iunit">Unidad base</label><select id="iunit"><option value="L" '+(x?.unit==='L'?'selected':'')+'>Litro (L)</option><option value="kg" '+(x?.unit==='kg'?'selected':'')+'>Kilogramo (kg)</option></select></div>':'<div class="field"><label for="itype">Tipo</label><select id="itype">'+['Envase','Tapa','Etiqueta','Caja','Precinto','Otro'].map(t=>'<option '+(x?.type===t?'selected':'')+'>'+t+'</option>').join('')+'</select></div>')+field(prod?'Costo por litro o kg (USD)':'Costo por unidad (USD)','icost','number',x?x.cost:'','min="0" step="any" required')+field('Fecha del costo','idate','date',x?.priceDate||today(),'required')+'</div><p class="muted">El costo se ingresa en dólares. Si cambia el precio, actualizá también la fecha.</p><div class="actions"><button class="btn primary">'+(x?'Guardar cambios':'Agregar '+label)+'</button>'+(x?'<button type="button" class="btn" id="cancelEdit">Cancelar</button>':'')+'</div></form></div><div class="panel"><h2>'+(prod?'Productos a granel':'Materiales de packaging')+' ('+items.length+')</h2>'+itemsTable(items,key,prod)+'</div>';
 }else if(tab==='dollar'){
  root.innerHTML='<div class="panel"><h2>Tipo de cambio</h2><p class="muted">Ingresá el valor en pesos argentinos de 1 dólar. Se usa para mostrar la equivalencia en ARS de los costos en USD.</p><form id="dollarForm"><div class="grid">'+field('Cotización del dólar (ARS por USD)','drate','number',dollarValue()||'','min="0.01" step="any" required')+field('Fecha de actualización','ddate','date',db.settings.dollarDate||today(),'required')+'</div><div class="actions"><button class="btn primary">Guardar cotización</button></div></form><div class="result"><div class="muted">Cotización guardada</div><strong>'+(dollarValue()?ars(dollarValue())+' por USD':'Todavía no cargaste el dólar')+'</strong><p class="muted">'+(db.settings.dollarDate?'Fecha: '+esc(db.settings.dollarDate):'')+'</p>'+(stale(db.settings.dollarDate)?'<p class="stale">La cotización tiene más de 30 días o no tiene fecha. Revisala.</p>':'')+'</div></div>';
 }else if(tab==='history'){
  root.innerHTML='<div class="panel"><h2>Historial de cálculos</h2><p class="muted">Los cálculos guardan una copia de los costos, fechas y cotización del dólar utilizados.</p>'+(db.history.length?'<div class="tablewrap"><table><thead><tr><th>Fecha cálculo</th><th>Producto</th><th>Presentación</th><th class="num">Granel (USD)</th><th class="num">Packaging (USD)</th><th class="num">Total (USD)</th><th class="num">Total (ARS al calcular)</th></tr></thead><tbody>'+db.history.slice().reverse().map(h=>'<tr><td>'+esc(h.date)+'</td><td>'+esc(h.product)+'</td><td>'+esc(h.amount+' '+h.unit)+'</td><td class="num">'+usd(h.bulk)+'</td><td class="num">'+usd(h.pack)+'</td><td class="num"><b>'+usd(h.total)+'</b></td><td class="num">'+(h.dollarRate?ars(h.total*h.dollarRate):'—')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Todavía no hay cálculos guardados.</div>')+'<div class="actions"><button class="btn" id="export">Exportar datos (JSON)</button><button class="btn" id="backup">Descargar historial (CSV)</button></div></div>';
 }else{
  root.innerHTML='<div class="panel"><h2>Calcular costo de presentación</h2><p class="muted">Los costos base se manejan en dólares (USD). Cotización actual: <b>'+(dollarValue()?ars(dollarValue())+' por USD':'no cargada')+'</b> '+(db.settings.dollarDate?'· fecha '+esc(db.settings.dollarDate):'')+'</p><form id="calcForm"><div class="grid"><div class="field"><label for="cproduct">Producto a granel</label><select id="cproduct" required><option value="">Seleccioná un producto</option>'+options(db.products,true)+'</select></div>'+field('Contenido por envase','amount','number','1','min="0.001" step="any" required')+'<div class="field"><label for="cunit">Unidad</label><input id="cunit" value="Elegí un producto" disabled></div></div><div class="field" style="margin-top:18px"><label>Materiales de packaging</label><div id="materialRows"></div></div><div class="actions"><button type="button" class="btn" id="addMaterial">+ Agregar material</button><button class="btn primary">Calcular y guardar</button></div></form><div id="result"></div><div class="notice">Los precios de productos y packaging que tengan más de 30 días desde su fecha de costo aparecen en rojo. Revisalos antes de usar el cálculo. El cálculo puede hacerse sin cotización del dólar, pero no mostrará equivalencia en pesos hasta que la cargues.</div></div><div class="panel"><h2>Resumen</h2><div class="grid"><div><span class="muted">Productos</span><h2>'+db.products.length+'</h2></div><div><span class="muted">Materiales</span><h2>'+db.materials.length+'</h2></div><div><span class="muted">Cálculos guardados</span><h2>'+db.history.length+'</h2></div></div></div>';
  const p=document.getElementById('cproduct'),u=document.getElementById('cunit');p.addEventListener('change',()=>{u.value=p.value===''?'Elegí un producto':db.products[p.value].unit});document.getElementById('addMaterial').addEventListener('click',addMaterialRow);addMaterialRow();
 }
}
function itemsTable(items,key,prod){if(!items.length)return '<div class="empty">Todavía no hay registros.</div>';return '<div class="tablewrap"><table><thead><tr><th>Nombre</th>'+(prod?'<th>Familia</th>':'')+'<th>'+(prod?'Unidad':'Tipo')+'</th><th class="num">Costo (USD)</th><th class="num">Equiv. ARS</th><th>Fecha del costo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>'+items.map((x,i)=>'<tr><td>'+esc(x.name)+'</td>'+(prod?'<td>'+esc(x.family||'Sin familia')+'</td>':'')+'<td>'+esc(prod?x.unit:x.type)+'</td><td class="num">'+usd(x.cost)+'</td><td class="num">'+usdArs(x.cost)+'</td><td>'+dateCell(x.priceDate)+'</td><td>'+(stale(x.priceDate)?'<span class="stale">Actualizar precio</span>':'<span class="fresh">Vigente</span>')+'</td><td><div class="actions-cell"><button class="edit" data-edit="'+key+'" data-index="'+i+'">Editar</button><button class="del" data-delete="'+key+'" data-index="'+i+'">Eliminar</button></div></td></tr>').join('')+'</tbody></table></div>'}
function addMaterialRow(){const el=document.getElementById('materialRows');if(!db.materials.length){el.innerHTML='<p class="muted">Primero cargá materiales en la pestaña Packaging.</p>';return}const row=document.createElement('div');row.className='grid';row.style.marginTop='8px';row.innerHTML='<div class="field"><label>Material</label><select class="mat-select">'+options(db.materials,true)+'</select></div><div class="field"><label>Cantidad por envase</label><input class="mat-qty" type="number" min="0" step="any" value="1"></div><div class="actions"><button type="button" class="del remove-row">Quitar</button></div>';row.querySelector('.remove-row').onclick=()=>row.remove();el.appendChild(row)}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b){tab=b.dataset.tab;editing=null;render()}});
document.getElementById('app').addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='itemForm'){const key=tab==='products'?'products':'materials',name=document.getElementById('iname').value.trim(),cost=Number(document.getElementById('icost').value),priceDate=document.getElementById('idate').value;if(!name||!(cost>=0)||!priceDate)return;const item={name,cost,priceDate};if(key==='products'){item.family=document.getElementById('ifamily').value.trim()||'Sin familia';item.unit=document.getElementById('iunit').value}else item.type=document.getElementById('itype').value;if(editing&&editing.key===key)db[key][editing.index]=item;else db[key].push(item);editing=null;save();render()}else if(e.target.id==='dollarForm'){const rate=Number(document.getElementById('drate').value),date=document.getElementById('ddate').value;if(!(rate>0)||!date)return;db.settings={dollarRate:rate,dollarDate:date};save();render()}else if(e.target.id==='calcForm'){calculate()}});
document.getElementById('app').addEventListener('click',e=>{const ed=e.target.closest('[data-edit]');if(ed){editing={key:ed.dataset.edit,index:Number(ed.dataset.index)};tab=ed.dataset.edit;render();return}const d=e.target.closest('[data-delete]');if(d){if(confirm('¿Eliminar este registro?')){db[d.dataset.delete].splice(Number(d.dataset.index),1);save();render()}}if(e.target.id==='cancelEdit'){editing=null;render()}if(e.target.id==='goDollar'){tab='dollar';render()}if(e.target.id==='export'){download('costos-industriales.json',JSON.stringify(db,null,2),'application/json')}if(e.target.id==='backup'){const rows=[['fecha_calculo','producto','cantidad','unidad','granel_usd','packaging_usd','total_usd','cotizacion_ars_usd'],...db.history.map(h=>[h.date,h.product,h.amount,h.unit,h.bulk,h.pack,h.total,h.dollarRate||''])];download('historial-costos.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv;charset=utf-8')}});
function calculate(){const pi=document.getElementById('cproduct').value;if(pi===''){alert('Elegí un producto.');return}const p=db.products[pi],amount=Number(document.getElementById('amount').value);if(!(amount>0)){alert('Ingresá un contenido mayor a cero.');return}let pack=0,lines=[];document.querySelectorAll('#materialRows .grid').forEach(row=>{const mi=Number(row.querySelector('.mat-select').value),qty=Number(row.querySelector('.mat-qty').value);if(db.materials[mi]&&qty>0){const m=db.materials[mi],subtotal=m.cost*qty;pack+=subtotal;lines.push({name:m.name,qty,cost:m.cost,priceDate:m.priceDate,subtotal})}});const bulk=amount*p.cost,total=bulk+pack,rate=dollarValue();const h={date:new Date().toLocaleString('es-AR'),product:p.name,unit:p.unit,amount,bulkCost:p.cost,productPriceDate:p.priceDate,bulk,pack,total,lines,dollarRate:rate,dollarDate:db.settings.dollarDate};db.history.push(h);save();document.getElementById('result').innerHTML='<div class="result"><div class="muted">Costo total por envase</div><strong>'+usd(total)+'</strong><p><b>Equivalente en pesos:</b> '+(rate?ars(total*rate):'cargá la cotización del dólar')+'</p><p class="muted">Dólar utilizado: '+(rate?ars(rate)+' por USD · '+esc(db.settings.dollarDate||'sin fecha'):'sin cotización')+'</p><div class="tablewrap"><table><thead><tr><th>Concepto</th><th>Fecha del costo</th><th class="num">Costo USD</th><th class="num">Subtotal USD</th></tr></thead><tbody><tr><td>Granel ('+amount+' '+esc(p.unit)+' × '+usd(p.cost)+')</td><td>'+dateCell(p.priceDate)+'</td><td class="num">'+usd(p.cost)+'</td><td class="num">'+usd(bulk)+'</td></tr>'+lines.map(l=>'<tr><td>'+esc(l.name)+' ('+l.qty+' × '+usd(l.cost)+')</td><td>'+dateCell(l.priceDate)+'</td><td class="num">'+usd(l.cost)+'</td><td class="num">'+usd(l.subtotal)+'</td></tr>').join('')+'<tr><td colspan="3"><b>Total</b></td><td class="num"><b>'+usd(total)+'</b></td></tr></tbody></table></div><p class="muted">El cálculo quedó guardado en Historial.</p></div>'}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
save();render();
</script></body></html>
